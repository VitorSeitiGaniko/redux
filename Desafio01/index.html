<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redux - Desafio 01</title>
    <script src="../redux.min.js"></script>
</head>

<body>
    <script>
        // Constantes para facilitar e evitar erros de digitação
        const INCREMENTAR_TEMPO = 'aluno/INCREMENTAR_TEMPO'
        const REDUZIR_TEMPO = 'aluno/REDUZIR_TEMPO'
        const MODIFICAR_EMAIL = 'aluno/MODIFICAR_EMAIL'
        const COMPLETAR_AULA = 'aulas/COMPLETAR_AULA'
        const COMPLETAR_CURSO = 'aulas/COMPLETAR_CURSO'
        const RESETAR_CURSO = 'aulas/RESETAR_CURSO'

        // Estados iniciais dos reducers
        const initialStateAluno = {
            nome: 'André Rafael',
            email: 'andre@origamid.com',
            diasRestantes: 120,
        };

        const initialStateAulas = [
            {
                id: 1,
                nome: 'Design',
                completa: true,
            },
            {
                id: 2,
                nome: 'HTML',
                completa: false,
            },
            {
                id: 3,
                nome: 'CSS',
                completa: false,
            },
            {
                id: 4,
                nome: 'JavaScript',
                completa: false,
            },
        ];

        // Criação dos reducers
        function reducerAluno(state = initialStateAluno, action) {
            if (action.type === INCREMENTAR_TEMPO) {
                return ({
                    ...state,
                    diasRestantes: state.diasRestantes + 1
                })
            }

            if (action.type === REDUZIR_TEMPO) {
                return ({
                    ...state,
                    diasRestantes: state.diasRestantes - 1
                })
            }

            if (action.type === MODIFICAR_EMAIL) {
                return ({
                    ...state,
                    email: action.payload
                })
            }
            return state
        }

        function reducerAulas(state = initialStateAulas, action) {
            if (action.type === COMPLETAR_AULA) {
                return (
                    state.map(aula =>
                        aula.id === action.payload ? { ...aula, completa: true } : aula
                    )
                )
            }

            if (action.type === COMPLETAR_CURSO) {
                return state.map(aula => {
                    return { ...aula, completa: true };
                });
            }

            if (action.type === RESETAR_CURSO) {
                return state.map(aula => {
                    return { ...aula, completa: false };
                });
            }

            return state
        }

        // Criação do Combiner Reducers
        const reducer = Redux.combineReducers({
            aluno: reducerAluno,
            aula: reducerAulas
        })


        // Criação da store
        const store = Redux.createStore(reducer, window.__REDUX_DEVTOOLS_EXTENSION__ && window.__REDUX_DEVTOOLS_EXTENSION__())


        // Action Creator
        function increment() {
            return {
                type: INCREMENTAR_TEMPO
            }
        }

        function decrement() {
            return {
                type: REDUZIR_TEMPO
            }
        }

        function changeEmail(email) {
            return {
                type: MODIFICAR_EMAIL,
                payload: email
            }
        }

        function completID(id) {
            return {
                type: COMPLETAR_AULA,
                payload: id
            }
        }

        function complet() {
            return {
                type: COMPLETAR_CURSO
            }
        }

        function reset() {
            return {
                type: RESETAR_CURSO
            }
        }

        // Action disparada        
        store.dispatch(increment())
        store.dispatch(increment())
        store.dispatch(increment())
        store.dispatch(increment())
        store.dispatch(decrement())
        store.dispatch(changeEmail('vitor.ganiko@gmail.com'))

        store.dispatch(complet())
        store.dispatch(reset())
        store.dispatch(completID(3))
    </script>
</body>

</html>
